name: Inspect wallet image
# Read-only look inside a built image (or M5Stack's base image): what starts
# at boot, what draws the splash, what the LEDs are driven by.
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL of an .img.xz (blank: M5Stack's base image)"
        required: false
        default: ""
permissions:
  contents: write   # drafts are only visible to a token that can write
jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Look inside
        env:
          URL: ${{ inputs.image_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          BASE=https://cardputer-zero-repo.oss-cn-shenzhen.aliyuncs.com/cardputerzero-trixie-arm64-latest.img.xz
          if [ -n "$URL" ]; then gh release download -R ${{ github.repository }} --pattern '*.img.xz' "$URL" -O img.xz || curl -fL "$URL" -o img.xz; else curl -fL "$BASE" -o img.xz; fi
          xz -dc img.xz > image.img
          L=$(sudo losetup -fP --show image.img)
          set +x
          echo "== image file"; ls -l image.img
          echo "== partitions"; sudo sfdisk -d image.img
          echo "== p2 device size"; sudo blockdev --getsize64 ${L}p2
          echo "== p2 superblock"; sudo dumpe2fs -h ${L}p2 2>&1 | grep -E "Block count|Block size|Filesystem state|magic|features" || true
          echo "== fsck (read-only)"; sudo e2fsck -fn ${L}p2 2>&1 | tail -8 || true
          sudo mkdir -p /mnt/r /mnt/b
          sudo mount -o ro ${L}p2 /mnt/r || { sudo dmesg | tail -8; exit 1; }
          sudo mount -o ro ${L}p1 /mnt/b
          echo "== cmdline.txt"; cat /mnt/b/cmdline.txt
          echo "== config.txt (non-comment)"; grep -v '^#' /mnt/b/config.txt | grep -v '^$'
          echo "== boot partition"; ls -la /mnt/b | head -60
          echo "== default target"; readlink /mnt/r/etc/systemd/system/default.target
          for d in /mnt/r/etc/systemd/system/*.wants /mnt/r/etc/systemd/system/*.target.wants; do echo "== $d"; ls -la $d; done 2>/dev/null
          echo "== masked units"; find /mnt/r/etc/systemd/system -maxdepth 1 -lname /dev/null -printf '%f\n'
          echo "== units mentioning m5/splash/led/logo/APPLaunch/userconfig/firstboot"
          grep -rlisE "m5|splash|led|logo|applaunch|userconfig|firstboot|cardputer" /mnt/r/etc/systemd/system /mnt/r/usr/lib/systemd/system 2>/dev/null | sort -u
          for f in $(grep -rlisE "splash|logo|m5stack|cardputer|led" /mnt/r/usr/lib/systemd/system /mnt/r/etc/systemd/system 2>/dev/null | sort -u | head -30); do echo "------ $f"; cat "$f"; done
          echo "== initramfs / firstboot hooks"; ls /mnt/r/usr/lib/raspberrypi-sys-mods 2>/dev/null; ls /mnt/r/etc/initramfs-tools/scripts/* 2>/dev/null
          echo "== M5 packages"; grep -E '^Package: .*(m5|cardputer|cp0|applaunch|splash|led)' -i /mnt/r/var/lib/dpkg/status
          echo "== /etc/insert-coin-image"; cat /mnt/r/etc/insert-coin-image 2>/dev/null
          echo "== cloud-init disabled?"; ls /mnt/r/etc/cloud 2>/dev/null
          echo "== udev rules touching fb / graphics / backlight / input / keyboard"
          for f in /mnt/r/etc/udev/rules.d/* /mnt/r/usr/lib/udev/rules.d/*; do
            if grep -qiE "fb|graphics|backlight|cardputer|tca8418|input" "$f" 2>/dev/null; then
              echo "------ $f"; grep -iE "fb|graphics|backlight|cardputer|tca8418|SUBSYSTEM==\"input|KERNEL==\"event" "$f" | head -12
            fi
          done
          echo "== groups"; grep -E "^(video|input|czscreen|render|gpio|i2c|spi):" /mnt/r/etc/group
          echo "== fstab"; cat /mnt/r/etc/fstab
          echo "== M5 launcher files"; ls -la /mnt/r/usr/share/APPLaunch /mnt/r/opt/APPLaunch /mnt/r/usr/local/bin 2>/dev/null | head -60
          for f in /mnt/r/usr/lib/systemd/user/* /mnt/r/etc/systemd/user/* /mnt/r/usr/lib/systemd/system/*; do
            case "$(basename "$f")" in *[Aa][Pp][Pp]*|*m5*|*M5*|*cardputer*|*led*|*kbd*|*key*|*audio*|*sound*|*gov*|*cpufreq*|*userconfig*) echo "------ $f"; cat "$f" 2>/dev/null | head -40;; esac
          done
          echo "== who touches LEDs / the IO expander / keyboard backlight"
          sudo grep -rIlsE "m5ioe|/sys/class/leds|kbd_backlight|keyboard.?led|led_(on|off)|brightness" /mnt/r/usr/local /mnt/r/usr/share/APPLaunch /mnt/r/opt /mnt/r/etc /mnt/r/usr/lib/systemd /mnt/r/home 2>/dev/null | head -40
          echo "== strings in launcher binaries about leds/ioe/volume/governor"
          for b in $(sudo find /mnt/r/usr/share/APPLaunch /mnt/r/opt /mnt/r/usr/local/bin -type f -perm -u+x 2>/dev/null | head -40); do
            m=$(sudo strings -n 6 "$b" 2>/dev/null | grep -iE "leds|m5ioe|gpiochip|pwmchip|amixer|Speaker|Headphone|scaling_governor|tpa6130|cursor_blink|vtcon|keyboard light" | sort -u | head -20)
            [ -n "$m" ] && { echo "------ $b"; echo "$m"; }
          done
          echo "== sound config"; cat /mnt/r/etc/asound.conf 2>/dev/null; ls -la /mnt/r/var/lib/alsa 2>/dev/null; ls /mnt/r/usr/share/alsa/ucm2/conf.d 2>/dev/null | head
          sudo find /mnt/r/etc /mnt/r/usr/share/APPLaunch /mnt/r/home -name "*.state" -o -name "asound*" -o -name "*pipewire*conf*" 2>/dev/null | head -20
          echo "== cpu governor settings"; sudo grep -rIsE "scaling_governor|cpufreq" /mnt/r/etc /mnt/r/usr/local /mnt/r/usr/share/APPLaunch 2>/dev/null | head -10
          echo "== cmdline cursor / console"; grep -o "console=[^ ]*\|vt\.[^ ]*\|fbcon[^ ]*\|logo[^ ]*" /mnt/b/cmdline.txt
          echo "== leds in device tree overlays"; ls /mnt/b/overlays 2>/dev/null | grep -iE "m5|cardputer|cp0" 
          echo "== home dirs"; sudo ls -la /mnt/r/home/* 2>/dev/null | head -30
          echo "== partitions"; sudo sfdisk -d image.img
          echo "== blkid"; sudo blkid ${L}p1 ${L}p2

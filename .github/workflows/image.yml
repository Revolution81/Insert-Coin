name: Build wallet image

# Builds a burnable Insert Coin image from M5Stack's CardputerZero OS
# (tools/build_image.sh) and attaches it to a DRAFT release, so nothing is
# public until you've tested it and press Publish.
on:
  workflow_dispatch:
    inputs:
      base_sha256:
        description: "Expected SHA-256 of M5Stack's base image (blank: the one pinned in tools/build_image.sh)"
        required: false
        default: ""
      developer:
        description: "Developer image: SSH on for one key, DEVELOPER on the title, never released"
        type: boolean
        default: false
      ssh_key:
        description: "Developer image only: SSH public key(s), ssh-ed25519 ...; several separated by ;"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y parted e2fsprogs fdisk xz-utils curl
      - name: Build
        env:
          BASE_SHA256: ${{ inputs.base_sha256 }}
          DEV: ${{ inputs.developer && '1' || '0' }}
          DEV_SSH_KEY: ${{ inputs.ssh_key }}
        run: |
          [ -n "$BASE_SHA256" ] || unset BASE_SHA256
          sudo -E sh tools/build_image.sh
      - name: Developer image (a download on this run's page, never a release)
        if: ${{ inputs.developer }}
        uses: actions/upload-artifact@v4
        with:
          name: insert-coin-developer-image
          path: out/*
          retention-days: 7
          compression-level: 0
      - name: Draft release
        if: ${{ !inputs.developer }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' core/version.py)
          TAG="image-v$VERSION-$(date -u +%Y%m%d%H%M)"
          gh release create "$TAG" out/*.img.xz out/*.sha256 --draft --prerelease \
            --title "Insert Coin $VERSION Savings edition: wallet image (test build)" \
            --notes "SAVINGS EDITION. The device boots straight into Insert Coin and runs nothing else. For spending money there is also the Spending edition (an app in M5Stack's launcher, deploy/install.sh --app); keep savings here, not there. Burn with M5 Imager or Raspberry Pi Imager (Use custom). Check the SHA-256 before burning. Built by this workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
